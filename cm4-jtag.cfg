adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0018 0x001b
adapter speed 1000

ftdi layout_signal TCK  -data 0x0001
ftdi layout_signal TDI  -data 0x0002
ftdi layout_signal TDO  -input 0x0004
ftdi layout_signal TMS  -data 0x0008
ftdi layout_signal nTRST -data 0x0010

transport select jtag
reset_config trst_only
jtag_ntrst_delay 500

set _CHIPNAME bcm2711
set _DAP_TAPID 0x4ba00477

jtag newtap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_DAP_TAPID

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _DBGBASE {0x80410000 0x80510000 0x80610000 0x80710000}
set _CTIBASE  {0x80420000 0x80520000 0x80620000 0x80720000}

set _CORECOUNT 4
for {set _core 0} {$_core < $_CORECOUNT} {incr _core} {
    cti create $_CHIPNAME.cti.$_core -dap $_CHIPNAME.dap \
        -ap-num 0 -baseaddr [lindex $_CTIBASE $_core]

    target create $_CHIPNAME.cpu$_core aarch64 \
        -dap $_CHIPNAME.dap -coreid $_core \
        -dbgbase [lindex $_DBGBASE $_core] \
        -cti $_CHIPNAME.cti.$_core
}

targets $_CHIPNAME.cpu0
init