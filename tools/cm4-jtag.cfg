adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0018 0x001b
adapter speed 1000

ftdi layout_signal TCK  -data 0x0001
ftdi layout_signal TDI  -data 0x0002
ftdi layout_signal TDO  -input 0x0004
ftdi layout_signal TMS  -data 0x0008
ftdi layout_signal nTRST -data 0x0010

transport select jtag
reset_config none
jtag_ntrst_delay 1000

set _CHIPNAME bcm2711
set _DAP_TAPID 0x4ba00477

jtag newtap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_DAP_TAPID

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _DBGBASE {0x80410000 0x80510000 0x80610000 0x80710000}
set _CTIBASE  {0x80420000 0x80520000 0x80620000 0x80720000}

cti create $_CHIPNAME.cti.0 -dap $_CHIPNAME.dap -ap-num 0 -baseaddr [lindex $_CTIBASE 0]
cti create $_CHIPNAME.cti.1 -dap $_CHIPNAME.dap -ap-num 0 -baseaddr [lindex $_CTIBASE 1]
cti create $_CHIPNAME.cti.2 -dap $_CHIPNAME.dap -ap-num 0 -baseaddr [lindex $_CTIBASE 2]
cti create $_CHIPNAME.cti.3 -dap $_CHIPNAME.dap -ap-num 0 -baseaddr [lindex $_CTIBASE 3]

target create $_CHIPNAME.cpu0 aarch64 -dap $_CHIPNAME.dap -coreid 0 -dbgbase [lindex $_DBGBASE 0] -cti $_CHIPNAME.cti.0
target create $_CHIPNAME.cpu1 aarch64 -dap $_CHIPNAME.dap -coreid 1 -dbgbase [lindex $_DBGBASE 1] -cti $_CHIPNAME.cti.1
target create $_CHIPNAME.cpu2 aarch64 -dap $_CHIPNAME.dap -coreid 2 -dbgbase [lindex $_DBGBASE 2] -cti $_CHIPNAME.cti.2
target create $_CHIPNAME.cpu3 aarch64 -dap $_CHIPNAME.dap -coreid 3 -dbgbase [lindex $_DBGBASE 3] -cti $_CHIPNAME.cti.3

targets $_CHIPNAME.cpu0
init
